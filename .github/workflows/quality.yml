name: Qualité
on:
  pull_request:
  push:
    branches: [main, improve/public-2026-10]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: task_manager
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U task_manager -d task_manager"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://task_manager:test-only-password@127.0.0.1:5432/task_manager
      TEST_DATABASE_URL: postgresql://task_manager:test-only-password@127.0.0.1:5432/postgres
      JWT_SECRET: ci-only-access-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret-at-least-32-characters
      E2E_SCREENSHOTS: test-results/screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm audit --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-e2e
          path: test-results/screenshots
